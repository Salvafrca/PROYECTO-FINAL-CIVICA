name: 'proyecto_automodelismo'
version: '1.0.0'
config-version: 2

# En dbt Cloud el perfil lo gestiona la plataforma (credenciales de cada entorno)
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


# =====================================================================
# Configuración por capa (se hereda por carpeta).
# Lo común va aquí; en cada modelo solo lo excepcional.
# Bronze no aparece: dbt solo lo lee con source(), nunca escribe en él.
# =====================================================================
models:
  proyecto_automodelismo:

    # Staging: renombrar y castear, 1:1 con bronze. Vistas: no duplican datos.
    staging:
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +materialized: view
      +tags: ['staging']
      set_up:
        +schema: set_up

    # Silver: limpiar, deduplicar y normalizar (modelo en 3FN). Tablas.
    silver:
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +schema: silver
      +materialized: table
      +tags: ['silver']

    # Gold: modelos dimensionales de consumo, un esquema por caso de uso. Tablas.
    gold:
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      +materialized: table
      +tags: ['gold']
      caso_01:
        +schema: caso_01
        +tags: ['caso_01']    # rueda más rápida en tierra con lluvia
      caso_02:
        +schema: caso_02
        +tags: ['caso_02']    # mecánico frente a coche nuevo para hacer podio