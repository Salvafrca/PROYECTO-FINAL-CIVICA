version: 2

models:
  - name: dim_caso02_piloto
    description: Pilotos y si tienen mecánico (caso 2).
    columns:
      - name: key_piloto
        data_tests: [unique, not_null]
      - name: tiene_mecanico
        data_tests: [not_null]

  # NUEVO: historia del piloto (SCD tipo 2) desde piloto_snapshot
  - name: dim_caso02_piloto_historia
    description: >
      Historia de cada piloto (SCD tipo 2) a partir de piloto_snapshot: una fila por versión,
      con desde cuándo hasta cuándo fue válida (hora de Madrid). Caso 2.
    columns:
      - name: key_version
        data_tests: [unique, not_null]
      - name: key_piloto
        data_tests:
          - not_null
          - unique:
              config:
                where: "es_vigente"      # una sola versión vigente por piloto
      - name: valido_desde
        data_tests: [not_null]

  - name: dim_caso02_coche
    description: Coches con su estado y si son viejos (caso 2).
    columns:
      - name: key_coche
        data_tests: [unique, not_null]
      - name: es_viejo
        data_tests: [not_null]

  - name: dim_caso02_carrera
    description: Carreras con fecha y circuito (caso 2).
    columns:
      - name: key_carrera
        data_tests: [unique, not_null]

  - name: fct_caso02_resultado
    description: >
      Posición de un piloto en una carrera y si hizo podio (caso 2).
      Incremental delete+insert por carrera: si llega un set-up nuevo o corregido se reclasifica su carrera entera.
    data_tests:
      # Cada carrera tiene exactamente un 1º, un 2º y un 3º
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['key_carrera', 'posicion']
    columns:
      - name: key_resultado
        data_tests: [unique, not_null]
      - name: key_carrera
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_caso02_carrera')
                field: key_carrera
      - name: key_coche
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_caso02_coche')
                field: key_coche
      - name: key_piloto
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_caso02_piloto')
                field: key_piloto
      - name: posicion
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      # NUEVO: cuándo llegó el set-up a bronze (filtro del incremental)
      - name: _loaded_at
        data_tests: [not_null]

  - name: agg_caso02_podio
    description: Respuesta del caso 2. Tasa de podio con y sin cada factor y diferencia en puntos.
    columns:
      - name: factor
        data_tests: [unique, not_null]

  - name: agg_caso02_podio_cruzado
    description: >
      Caso 2, tabla 2x2 (mecánico × coche viejo). Tasa de podio de cada grupo y efecto
      de cada factor manteniendo fijo el otro.
    data_tests:
      # Exactamente una fila por casilla de la tabla 2x2
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['tiene_mecanico', 'coche_no_viejo']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "tasa_podio_pct between 0 and 100"
    columns:
      - name: participaciones
        data_tests: [not_null]